name: Hidencloud Auto Renew New

on:
  schedule:
    # 每天北京时间 11:00（UTC 3:00）执行一次
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  renew:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install System & Python Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11-utils xdotool scrot fonts-noto-cjk
          pip install seleniumbase requests beautifulsoup4
          seleniumbase install chromedriver

      - name: Start Proxy (sing-box)
        continue-on-error: true
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: |
          if [ -z "$PROXY_URL" ]; then
            echo "PROXY_URL not set, skipping sing-box setup."
            exit 0
          fi
          SINGBOX_VER="1.11.0"
          echo "Downloading sing-box v${SINGBOX_VER}..."
          wget -q "https://github.com/SagerNet/sing-box/releases/download/v${SINGBOX_VER}/sing-box-${SINGBOX_VER}-linux-amd64.tar.gz"
          tar -xzf "sing-box-${SINGBOX_VER}-linux-amd64.tar.gz"
          mv "sing-box-${SINGBOX_VER}-linux-amd64/sing-box" ./sing-box
          chmod +x ./sing-box
          echo "Generating sing-box config from PROXY_URL..."
          python proxy_handler.py
          echo "Starting sing-box..."
          nohup ./sing-box run -c config.json > singbox.log 2>&1 &
          for i in $(seq 1 10); do
            if (echo > /dev/tcp/127.0.0.1/8080) 2>/dev/null; then
              echo "sing-box is listening on 127.0.0.1:8080"
              exit 0
            fi
            sleep 1
          done
          echo "sing-box did not open 127.0.0.1:8080 in 10s; log follows:"
          cat singbox.log

      - name: Run Regression Tests
        run: |
          if [ -f tests/test_app.py ] && [ -f tests/test_browser_renew.py ]; then
            python -m unittest discover -s tests -p 'test_*.py' -v
          else
            echo "::warning::Regression test files are missing from this checkout. Upload tests/test_app.py and tests/test_browser_renew.py to enable tests. Continuing to the renewal script."
          fi

      - name: Run Renew Script
        env:
          USERS_JSON: ${{ secrets.USERS_JSON }}
          HTTP_PROXY: ${{ secrets.HTTP_PROXY }}
          PROXY_SERVER: ${{ secrets.PROXY_SERVER }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
            python3 app.py

      - name: Upload Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: ./*.png
          if-no-files-found: ignore
